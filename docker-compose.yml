

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: moldb-postgres
    environment:
      POSTGRES_USER: moldb
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: molecule_discovery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moldb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moldb-network

  # Redis Cache & Message Broker
  redis:
    image: redis:7.2-alpine
    container_name: moldb-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - moldb-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: moldb-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql+asyncpg://moldb:1@postgres:5432/molecule_discovery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moldb-network

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: moldb-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql+asyncpg://moldb:1@postgres:5432/molecule_discovery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - moldb-network

  # Tests Runner
  tests:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: moldb-tests
    command: tail -f /dev/null  # Keep container running
    volumes:
      - ./backend:/app
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql+asyncpg://moldb:1@postgres:5432/molecule_discovery
      - TEST_DATABASE_URL=postgresql+asyncpg://moldb:1@postgres:5432/molecule_discovery_test
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moldb-network

networks:
  moldb-network:
    driver: bridge

volumes:
  postgres_data: