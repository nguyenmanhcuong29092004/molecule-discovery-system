[pytest]
# Pytest configuration for integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    asyncio: mark test as async

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    
# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio